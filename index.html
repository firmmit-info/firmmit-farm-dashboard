<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FIRMMIT 딸기수직농장 모니터링</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet"/>
  <style>
:root {--bg-main:#0a0f0a;--bg-card:#111811;--bg-card2:#162016;--border-color:#1e3a1e;--accent-green:#00ff88;--accent-teal:#00d4aa;--accent-yellow:#ffd700;--accent-red:#ff4d6d;--accent-blue:#4da6ff;--text-main:#e8f5e8;--text-sub:#7aaa7a;--text-muted:#4a6a4a;--glow-green:0 0 15px rgba(0,255,136,0.3);}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg-main);color:var(--text-main);min-height:100vh;overflow:hidden;} /* 스크롤 방지 */
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background-image:linear-gradient(rgba(0,255,136,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,136,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
.wrapper{position:relative;z-index:1;max-width:1920px;margin:0 auto;padding:0 16px 10px;}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:linear-gradient(135deg,#0d1a0d,#111f11);border-bottom:2px solid var(--accent-green);box-shadow:0 4px 20px rgba(0,255,136,0.1);margin-bottom:12px;}
.logo-area{display:flex;align-items:center;gap:12px;}
.logo-icon{width:44px;height:44px;background:linear-gradient(135deg,var(--accent-green),var(--accent-teal));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:var(--glow-green);}
.logo-text h1{font-size:22px;font-weight:900;color:var(--accent-green);letter-spacing:1.5px;}
.logo-text p{font-size:13px;color:var(--text-sub);margin-top:1px;}
.status-badge{display:flex;align-items:center;gap:8px;background:rgba(0,255,136,0.1);border:1px solid var(--accent-green);border-radius:20px;padding:5px 14px;font-size:14px;color:var(--accent-green);}
.status-dot{width:7px;height:7px;background:var(--accent-green);border-radius:50%;animation:blink 1.5s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
.clock-area{text-align:right;}
#clock-time{font-size:32px;font-weight:700;color:var(--accent-green);text-shadow:var(--glow-green);line-height:1;}
#clock-date{font-size:14px;color:var(--text-sub);margin-top:2px;}

.grid-main{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;padding:15px;position:relative;overflow:hidden;}
.card-title{font-size:22px;font-weight:700;color:var(--text-sub);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.card-title i{color:var(--accent-green);font-size:22px;}

/* 상단 카드 */
.weather-card{grid-column:span 1;}
.env-card{grid-column:span 2;}
.power-card{grid-column:span 1;}

.weather-main{display:flex;align-items:center;justify-content:space-around;margin-bottom:15px;}
.weather-temp .val{font-size:40px;font-weight:700;color:var(--accent-yellow);}
.weather-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.weather-item{background:var(--bg-card2);border-radius:8px;padding:10px;text-align:center;}
.weather-item .label{font-size:15px;color:var(--text-muted);margin-bottom:2px;}
.weather-item .value{font-size:18px;font-weight:700;color:var(--accent-blue);}

.chart-container{position:relative;height:140px;}
.env-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;}
.env-stat-item{background:var(--bg-card2);border-radius:8px;padding:10px;text-align:center;}
.env-stat-item .s-label{font-size:16px;color:var(--text-muted);}
.env-stat-item .s-val{font-size:20px;font-weight:700;}

/* 전력 */
.power-card{grid-column:span 1;}
.power-gauge-wrap{position:relative;text-align:center;margin:10px 0;}
.power-gauge-wrap canvas{display:block;margin:0 auto;}
.power-center-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
.power-center-text .kw{font-size:30px;font-weight:700;color:var(--accent-yellow);}
.power-center-text .kwlabel{font-size:14px;color:var(--text-muted);}
.power-items{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;}
.power-item{background:var(--bg-card2);border-radius:8px;padding:10px 8px;text-align:center;font-size:18px;color:var(--text-sub);}
.power-item .pval{font-size:18px;font-weight:700;color:var(--accent-yellow);display:block;margin-top:3px;}

/* 수확량 카드 */
.harvest-card{grid-column:span 4;}
.harvest-inner{display:flex; flex-wrap:wrap; gap:15px; align-items:flex-start;}
.harvest-inner > div:first-child{flex:1 1 600px; min-width:0;}
.harvest-total .big{font-size:32px;font-weight:700;color:var(--accent-green);}
.harvest-chart-wrap{position:relative;height:180px;}
.harvest-right{flex:0 0 420px; background:var(--bg-card2);border-radius:10px;padding:15px;display:flex;flex-direction:column;gap:12px;}
.grade-donut-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.grade-section-title{font-size:20px;font-weight:700;color:var(--text-sub);letter-spacing:1px;}
.grade-section-note{font-size:18px;color:var(--text-muted);margin-top:3px;}
.grade-donut-wrap{position:relative;width:100px;height:100px;flex-shrink:0;}
.grade-donut-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
.grade-donut-center .gd-val{font-size:20px;font-weight:700;color:var(--accent-green);}
.grade-donut-center .gd-label{font-size:12px;color:var(--text-muted);}
.grade-bars{flex:1;min-width:180px;display:flex;flex-direction:column;gap:8px;}
.grade-bar-row{display:flex;flex-direction:column;gap:4px;}
.grade-bar-top{display:flex;align-items:center;justify-content:space-between;}
.grade-bar-label{font-size:16px;font-weight:600;}
.grade-bar-meta{display:flex;align-items:center;gap:8px;}
.grade-bar-pct{font-size:16px;font-weight:700;}
.grade-bar-kg{font-size:14px;color:var(--text-muted);}
.grade-bar-bg{width:100%;height:8px;background:var(--bg-main);border-radius:4px;overflow:hidden;}
.grade-bar-fill{height:100%;border-radius:4px;transition:width 1s ease;}

/* 하단 3단 통합 레이아웃 */
.bottom-row{grid-column:span 4; display:grid; grid-template-columns: 1fr 1fr 1.3fr; gap:12px; height: 260px;}
.bottom-card{height:100%; display:flex; flex-direction:column;}
.list-container{flex:1; overflow:hidden; display:flex; flex-direction:column; gap:8px;}
.list-item{display:flex; flex-direction:column; padding:8px 0; border-bottom:1px solid var(--border-color);}
.list-item:last-child{border-bottom:none;}
.list-top{display:flex; align-items:center; gap:8px; margin-bottom:4px;}
.item-badge{font-size:13px; font-weight:700; padding:2px 7px; border-radius:6px;}
.item-title{font-size:17px; font-weight:600; color:var(--text-main); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.item-content{font-size:15px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-left:2px;}
.item-date{font-size:14px; color:var(--text-muted); margin-left:auto;}

/* 하단 근무자 현황 */
.worker-mini-grid{display:grid; grid-template-columns: repeat(2, 1fr); gap:10px; flex:1; align-content:start;}
.worker-mini-item{display:flex; align-items:center; gap:10px; background:var(--bg-card2); border-radius:8px; padding:12px 14px; border:1px solid var(--border-color);}
.worker-mini-avatar{width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:700;}
.worker-mini-info .name{font-size:16px; font-weight:700; margin-bottom:2px;}
.worker-mini-info .role{font-size:13px; color:var(--text-muted);}

.badge-manager{background:rgba(255,215,0,0.15);color:var(--accent-yellow);border:1px solid rgba(255,215,0,0.3);}
.badge-work{background:rgba(0,255,136,0.1);color:var(--accent-green);border:1px solid rgba(0,255,136,0.2);}
.green{color:var(--accent-green)}.blue{color:var(--accent-blue)}.yellow{color:var(--accent-yellow)}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(10,15,10,0.9);display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;color:var(--accent-green);">
  <div style="width:50px;height:50px;border:3px solid #1e3a1e;border-top-color:var(--accent-green);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:15px;"></div>
  <span>데이터 동기화 중...</span>
</div>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>

<div class="wrapper">
  <header class="header">
    <div class="logo-area">
      <div class="logo-icon">🍓</div>
      <div class="logo-text"><h1>FIRMMIT</h1><p>이천 딸기수직농장 모니터링</p></div>
    </div>
    <div class="status-badge" id="statusBadge"><div class="status-dot"></div> CONNECTING...</div>
    <div class="clock-area"><div id="clock-time">00:00:00</div><div id="clock-date"></div></div>
  </header>

  <div class="grid-main">
    <div class="card weather-card">
      <div class="card-title"><i class="fas fa-cloud-sun"></i> 외부 기상</div>
      <div class="weather-main">
        <div id="weather-icon" style="font-size:48px;">⛅</div>
        <div class="weather-temp"><span class="val" id="ext-temp">--</span><span style="font-size:20px; color:var(--text-sub);">°C</span></div>
      </div>
      <div class="weather-grid">
        <div class="weather-item"><div class="label">습도</div><div class="value" id="ext-hum">--%</div></div>
        <div class="weather-item"><div class="label">풍속</div><div class="value" id="ext-wind">--m/s</div></div>
      </div>
    </div>

    <div class="card env-card">
      <div class="card-title"><i class="fas fa-temperature-half"></i> 내부 환경 모니터링</div>
      <div class="chart-container"><canvas id="envChart"></canvas></div>
      <div class="env-stats">
        <div class="env-stat-item"><div class="s-label">현재 온도</div><div class="s-val green" id="in-temp">--°C</div></div>
        <div class="env-stat-item"><div class="s-label">현재 습도</div><div class="s-val blue" id="in-hum">--%</div></div>
        <div class="env-stat-item"><div class="s-label">CO₂</div><div class="s-val yellow" id="in-co2">--</div></div>
      </div>
    </div>

    <div class="card power-card">
      <div class="card-title"><i class="fas fa-bolt"></i> 전력량</div>
      <div class="power-gauge-wrap">
        <canvas id="powerGauge" width="130" height="130"></canvas>
        <div class="power-center-text">
          <div class="kw" id="power-val">--</div>
          <div class="kwlabel">kW 사용</div>
        </div>
      </div>
      <div class="power-items">
        <div class="power-item" style="padding:6px;">공조 <span class="pval" id="pw-hvac">--kW</span></div>
        <div class="power-item" style="padding:6px;">조명 <span class="pval" id="pw-light">--kW</span></div>
      </div>
    </div>

    <div class="card harvest-card">
      <div class="card-title"><i class="fas fa-chart-bar"></i> 수확량 현황 (최근 2주)</div>
      <div class="harvest-inner">
        <div><div class="harvest-chart-wrap"><canvas id="harvestChart"></canvas></div></div>
        <div class="harvest-right">
          <div class="grade-section-title">🍓 과실 등급 분류 (누적)</div>
          <div style="display:flex; align-items:center; gap:20px;">
            <canvas id="gradeDonut" width="100" height="100"></canvas>
            <div>
              <div style="font-size:14px; color:var(--text-muted);">총 분류량</div>
              <div id="grade-total-kg" style="font-size:26px; font-weight:700; color:var(--accent-green);">--</div>
            </div>
          </div>
          <div style="font-size:15px; display:flex; flex-direction:column; gap:6px; margin-top:5px;">
             <div style="display:flex; justify-content:space-between;"><span>정상과</span><span id="kg-normal" class="green">--kg</span></div>
             <div style="display:flex; justify-content:space-between;"><span>소과</span><span id="kg-small" class="yellow">--kg</span></div>
          </div>
        </div>
      </div>
    </div>

    <div class="bottom-row">
      <div class="card bottom-card">
        <div class="card-title"><i class="fas fa-bullhorn"></i> 공지사항</div>
        <div id="notice-list" class="list-container">
           <div style="color:var(--text-muted); padding:10px;">데이터 로딩중...</div>
        </div>
      </div>
      
      <div class="card bottom-card">
        <div class="card-title"><i class="fas fa-calendar-check"></i> 방문 일정</div>
        <div id="visitor-list" class="list-container">
           <div style="color:var(--text-muted); padding:10px;">데이터 로딩중...</div>
        </div>
      </div>

      <div class="card bottom-card">
        <div class="card-title"><i class="fas fa-user-friends"></i> 오늘 출근자</div>
        <div id="worker-list-today" class="worker-mini-grid">
           <div style="grid-column:span 2; color:var(--text-muted); padding:10px;">데이터 로딩중...</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ★ 아래 API URL은 기존 예은 님의 주소 그대로 유지했습니다.
const API_URL='https://script.google.com/macros/s/AKfycbyJO0gxcRh_XNsykIFSPYpez4cSvK7NB8NuFBga7sdwKtLLrJ6EtcSOrzkepGMqtGwm8A/exec';
const REFRESH_INTERVAL=60000;
let envChart=null,harvestChart=null,powerChart=null,gradeDonutChart=null;

function updateClock(){
  const now=new Date(),days=['일','월','화','수','목','금','토'];
  document.getElementById('clock-time').textContent=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
  document.getElementById('clock-date').textContent=`${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 ${days[now.getDay()]}요일`;
}
setInterval(updateClock,1000); updateClock();

async function fetchAPI(type){
  try{
    const res=await fetch(`${API_URL}?type=${type}`,{redirect:'follow'});
    return JSON.parse(await res.text());
  }catch(err){return null;}
}

// 1. 공지사항 (내용 노출, 최대 4개)
async function updateNotice() {
  const data = await fetchAPI('notice');
  const el = document.getElementById('notice-list');
  if (!el || !data || data.length === 0) {
    if(el) el.innerHTML = '<div style="color:var(--text-muted); padding:10px;">등록된 공지사항이 없습니다.</div>';
    return;
  }
  el.innerHTML = data.reverse().slice(0, 4).map(n => {
    let cls = n.category === '긴급' ? 'nb-important' : 'nb-general';
    let bg = n.category === '긴급' ? 'rgba(255,77,109,0.2)' : 'rgba(0,255,136,0.1)';
    let co = n.category === '긴급' ? 'var(--accent-red)' : 'var(--accent-green)';
    return `
      <div class="list-item">
        <div class="list-top">
          <span class="item-badge" style="background:${bg}; color:${co}">${n.category}</span>
          <span class="item-title">${n.title}</span>
          <span class="item-date">${n.date}</span>
        </div>
        <div class="item-content">${n.content || n.title}</div>
      </div>`;
  }).join('');
}

// 2. 방문 일정 (리스트형, 내용 노출, 최대 4개)
async function updateVisitor() {
  const data = await fetchAPI('visitor');
  const el = document.getElementById('visitor-list');
  if (!el || !data || data.length === 0) {
    if(el) el.innerHTML = '<div style="color:var(--text-muted); padding:10px;">예정된 방문 일정이 없습니다.</div>';
    return;
  }
  
  // 날짜 순으로 정렬 후 4개 자르기
  const sortedData = data.sort((a,b) => new Date(a.date) - new Date(b.date)).slice(0, 4);
  
  el.innerHTML = sortedData.map(v => `
    <div class="list-item">
      <div class="list-top">
        <span class="item-badge" style="background:rgba(77,166,255,0.15); color:var(--accent-blue)">방문</span>
        <span class="item-title">${v.name}</span>
        <span class="item-date">${v.date} ${v.time}</span>
      </div>
      <div class="item-content">${v.purpose || '상세 방문 목적 없음'}</div>
    </div>`).join('');
}

// 3. 오늘 근무자 (서버에서 '오늘 출근 명단'만 걸러서 온다고 가정)
async function updateWorkers() {
  const data = await fetchAPI('workers'); 
  const el = document.getElementById('worker-list-today');
  if (!el) return;

  if (!data || !data.onDutyWorkers || data.onDutyWorkers.length === 0) {
    el.innerHTML = '<div style="grid-column:span 2; color:var(--text-muted); padding:20px; text-align:center;">오늘 출근 명단이 없습니다.</div>';
    return;
  }

  // 서버(GAS)에서 이름과 직책(role)을 정확히 매핑해서 보내준 데이터를 그립니다.
  el.innerHTML = data.onDutyWorkers.map(w => {
    const isMgr = w.role.includes('총괄') || w.role.includes('담당');
    const color = isMgr ? 'var(--accent-yellow)' : 'var(--accent-green)';
    const bgClr = isMgr ? 'rgba(255,215,0,0.1)' : 'rgba(0,255,136,0.1)';
    const badgeCls = isMgr ? 'badge-manager' : 'badge-work';
    const typeTxt = isMgr ? '담당자' : '작업자';

    return `
      <div class="worker-mini-item">
        <div class="worker-mini-avatar" style="background:${bgClr}; color:${color}; border:1px solid ${color}40">${String(w.name)[0]}</div>
        <div class="worker-mini-info" style="flex:1; overflow:hidden;">
          <div class="name">${w.name}</div>
          <div class="role" style="white-space:nowrap; text-overflow:ellipsis; overflow:hidden;">${w.role}</div>
        </div>
        <span class="item-badge ${badgeCls}" style="font-size:11px;">${typeTxt}</span>
      </div>
    `;
  }).join('');
}

// --- 나머지 기존 차트/날씨 로직 ---
async function updateWeather(){
  const data=await fetchAPI('weather'); if(!data)return;
  const iconMap={'맑음':'☀️','구름':'⛅','흐림':'☁️','비':'🌧️','눈':'❄️'};
  const iconKey=Object.keys(iconMap).find(k=>(data.description||'').includes(k));
  document.getElementById('weather-icon').textContent=iconKey?iconMap[iconKey]:'🌡️';
  document.getElementById('ext-temp').textContent=data.temperature;
  document.getElementById('ext-hum').textContent=data.humidity+'%';
  document.getElementById('ext-wind').textContent=data.windSpeed+'m/s';
}

async function updateEnv(){
  const data=await fetchAPI('env'); if(!data)return;
  const c=data.current;
  document.getElementById('in-temp').textContent=c.temperature+'°C';
  document.getElementById('in-hum').textContent=c.humidity+'%';
  document.getElementById('in-co2').textContent=c.co2;
  const cd={labels:data.hourly.map(h=>h.time),datasets:[
    {label:'온도',data:data.hourly.map(h=>h.temperature),borderColor:'#ff6b6b',borderWidth:2,tension:0.4,yAxisID:'y'},
    {label:'습도',data:data.hourly.map(h=>h.humidity),borderColor:'#4da6ff',borderWidth:2,tension:0.4,yAxisID:'y1'}
  ]};
  if(!envChart){envChart=new Chart(document.getElementById('envChart').getContext('2d'),{type:'line',data:cd,options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{display:false},y:{min:10,max:30},y1:{position:'right',min:40,max:90}}}});}
  else{envChart.data=cd; envChart.update();}
}

async function updateHarvest(){
  const data=await fetchAPI('harvest'); if(!data)return;
  const recent14 = (data.daily||[]).slice(-14);
  const cd={labels:recent14.map(d=>d.date.slice(5)),datasets:[{data:recent14.map(d=>d.amount),backgroundColor:'rgba(0,255,136,0.8)',borderRadius:4}]};
  if(!harvestChart){harvestChart=new Chart(document.getElementById('harvestChart').getContext('2d'),{type:'bar',data:cd,options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});}
  else{harvestChart.data=cd; harvestChart.update();}
  
  if(data.gradeToday){
     document.getElementById('grade-total-kg').textContent=data.gradeToday.total+'kg';
     document.getElementById('kg-normal').textContent=data.gradeToday.normal+'kg';
     document.getElementById('kg-small').textContent=data.gradeToday.small+'kg';
  }
}

async function updatePower(){
  const data=await fetchAPI('power'); if(!data)return;
  document.getElementById('power-val').textContent=data.current.total;
  document.getElementById('pw-hvac').textContent=data.current.hvac+'kW';
  document.getElementById('pw-light').textContent=data.current.light+'kW';
  const cd={labels:['공조','조명','여유'],datasets:[{data:[data.current.hvac, data.current.light, 80-data.current.total],backgroundColor:['#4da6ff','#ffd700','rgba(255,255,255,0.05)'],borderWidth:0}]};
  if(!powerChart){powerChart=new Chart(document.getElementById('powerGauge').getContext('2d'),{type:'doughnut',data:cd,options:{cutout:'70%',responsive:false,plugins:{legend:{display:false}}}});}
  else{powerChart.data=cd; powerChart.update();}
}

async function refreshAll(){
  document.getElementById('statusBadge').innerHTML='<div class="status-dot"></div> UPDATING...';
  await Promise.all([updateWeather(), updateEnv(), updateHarvest(), updatePower(), updateNotice(), updateVisitor(), updateWorkers()]);
  document.getElementById('loadingOverlay').style.display='none';
  const now=new Date();
  document.getElementById('statusBadge').innerHTML=`<div class="status-dot"></div> LIVE · ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')} 갱신`;
}

document.addEventListener('DOMContentLoaded',()=>{ refreshAll(); setInterval(refreshAll, REFRESH_INTERVAL); });
</script>
</body>
</html>
